[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watchlockai-edr"
version = "0.2.0"
description = "WatchLockAI unified EDR v1 (Sentinel + Tray + Local Console)"
readme = "DOCS/README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E","F","I","UP","B"]
ignore = ["D", "E501", "PLR2004", "RUF006"]

[tool.ruff.lint.isort]
known-first-party = ["core","platform","cognition","agents","forensics","intelligence","console","deployment"]